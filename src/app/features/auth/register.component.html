<div class="auth-container">
  <div class="auth-card">
    <h1>Gym Tracker</h1>
    <h2>Rejestracja</h2>

    <div class="auth-mode-tabs">
      <button 
        type="button" 
        class="tab-btn" 
        [class.active]="authMode() === 'local'" 
        (click)="setMode('local')">
        Profil lokalny
      </button>
      <button 
        type="button" 
        class="tab-btn" 
        [class.active]="authMode() === 'supabase'" 
        (click)="setMode('supabase')">
        Supabase Cloud Auth
      </button>
    </div>
    
    @if (errorMessage()) {
      <div class="alert error">{{ errorMessage() }}</div>
    }

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Nazwa użytkownika</label>
        <input id="username" type="text" formControlName="username" placeholder="Wprowadź nazwę" />
      </div>

      <div class="form-group">
        <label for="email">Adres e-mail</label>
        <input id="email" type="email" formControlName="email" placeholder="Wprowadź e-mail" />
      </div>

      @if (authMode() === 'supabase') {
        <div class="form-group">
          <label for="password">Hasło (Supabase, min. 6 znaków)</label>
          <input id="password" type="password" formControlName="password" placeholder="Wprowadź hasło" />
        </div>
      }

      <button type="submit" class="btn primary" [disabled]="registerForm.invalid || loading()">
        {{ loading() ? 'Rejestrowanie...' : (authMode() === 'supabase' ? 'Zarejestruj w Supabase' : 'Zarejestruj lokalnie') }}
      </button>
    </form>

    <div class="auth-links">
      <p>Masz już konto? <a routerLink="/login">Zaloguj się</a></p>
    </div>
  </div>
</div>
